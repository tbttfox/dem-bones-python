[project]
name = "dem-bones-python"
dynamic = [
    "version"
]
license = {file = 'LICENSE.md'}
authors = [
  { name="Tyler Fox", email="tyler@blur.com" },
]
description = "A relatively thin convenience wrapper for EA's dem-bones library"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

[project.urls]
"Project Page" = "https://github.com/blurstudio/dem-bones-python"

[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.15.0",
    "pybind11>=2.13.2",
]






[tool.hatch.build.targets.wheel.force-include]
"my_compiled_library.so" = "output_Python/_dem_bones_core.*"

[tool.hatch.build.targets.wheel]
packages = ["scripts/dembonespython"]
artifacts = [
  "*.so",
  "*.pyd",
  "!*.lib",
]

[tool.hatch.version]
path = "scripts/dembonespython/__init__.py"







[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "*.egg-info",
    "*.pyc",
    ".bzr",
    ".cache",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pycache__",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "docs",
    "node_modules",
    "shared-venv",
    "site-packages",
    "venv",
]

line-length = 100
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = [
    "B",
    "C",
    "E",
    "F",
    "N",
    "W",
    "B9",
]
ignore = [
    "B905",
    "C901",
    "E203",
    "E501",
    "E722",
    "N802",
    "N803",
    "N804",
    "N806",
    "N815",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

